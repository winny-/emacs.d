# gratefully generated by LLM
name: Publish Org

on:
  push:
    branches: [master]

jobs:
  publish:
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          apt-get update
          apt-get install -y emacs-nox elpa-htmlize

      - name: Publish
        run: |
          emacs-nox --batch --script ./misc/publish.el

      - name: Publish to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4
